name: Remote Streamlit smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-streamlit-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install remote smoke dependencies
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Run remote Streamlit smoke
        run: |
          uv run --with playwright python scripts/check_remote_streamlit_smoke.py \
            --url "https://gtpcnz.streamlit.app/?github_smoke=${{ github.run_id }}" \
            --attempts 8 \
            --sleep-seconds 75 \
            --settle-seconds 45 \
            --timeout-seconds 90
