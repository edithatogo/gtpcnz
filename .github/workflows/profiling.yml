name: Profiling

on:
  schedule:
    - cron: "23 18 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profiling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scalene:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install latest compatible profiling dependencies
        run: uv sync --upgrade --all-groups

      - name: Run Scalene profile
        run: uv run python -m scalene --cli --reduced-profile --profile-all scripts/run_scalene_profile.py
